apiVersion: apps/v1
kind: Deployment
metadata:
  name: bharat-banking
  namespace: kavach-mesh
  labels:
    app: bharat-banking
    tier: transactional-core
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: bharat-banking
  template:
    metadata:
      labels:
        app: bharat-banking
    spec:
      containers:
        - name: banking-highway
          image: ghcr.io/jaindhruv1923/bharat-banking:v3.2.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "implementation_banks.server:app", "--host", "0.0.0.0", "--port", "8050"]
          ports:
            - containerPort: 8050
              name: http
          env:
            - name: PORT
              value: "8050"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/bank/accounts
              port: 8050
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/bank/accounts
              port: 8050
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: banking-service
  namespace: kavach-mesh
  labels:
    app: bharat-banking
spec:
  type: ClusterIP
  selector:
    app: bharat-banking
  ports:
    - name: http
      port: 8050
      targetPort: 8050
