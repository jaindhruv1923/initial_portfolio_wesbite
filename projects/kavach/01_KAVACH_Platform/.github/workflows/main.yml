name: Kavach CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


# ============================================================
# JOB 1 — TEST
# ============================================================
jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # --------------------------------------------------------
      # Install backend dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest


      # --------------------------------------------------------
      # Run pytest from repository ROOT
      #
      # IMPORTANT:
      # We intentionally DO NOT use:
      #
      #     pytest tests
      #
      # because the repository does not have backend/tests/.
      #
      # Pytest will recursively discover test_*.py and *_test.py
      # files wherever they exist in the repository.
      # --------------------------------------------------------
      - name: Run test suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          python -m pytest -q --junitxml=pytest-results.xml


      # --------------------------------------------------------
      # Upload test results even when tests fail
      # --------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: warn


  # ============================================================
  # JOB 2 — KAVACH SECURITY GATE
  # ============================================================

  security-gate:
    name: Kavach Security Gate
    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Python
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # --------------------------------------------------------
      # Run Kavach security gate
      # --------------------------------------------------------
      - name: Run Kavach security and impact analysis
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          python ci_security_gate.py


      # --------------------------------------------------------
      # Upload security report
      # --------------------------------------------------------
      - name: Upload security gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: backend/security_gate_report.json
          if-no-files-found: warn


  # ============================================================
  # JOB 3 — FINAL REPORT
  # ============================================================

  report:
    name: Kavach CI Summary
    runs-on: ubuntu-latest

    needs:
      - test
      - security-gate

    if: always()

    steps:

      - name: Generate pipeline summary
        shell: bash
        run: |
          echo "# Kavach CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Test Job" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ needs.test.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Security Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: ${{ needs.security-gate.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.security-gate.result }}" = "success" ]; then
            echo "## Overall Result: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Overall Result: FAILED" >> "$GITHUB_STEP_SUMMARY"
          fi