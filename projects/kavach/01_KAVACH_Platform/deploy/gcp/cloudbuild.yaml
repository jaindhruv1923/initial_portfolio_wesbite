steps:
  # 1. Build container image using Google Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/kavach-platform:v3.2.0', '-f', 'Dockerfile', '.']

  # 2. Push to Google Artifact / Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/kavach-platform:v3.2.0']

  # 3. Deploy to Google Cloud Run (Serverless with Auto-Scaling & Concurrency)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'kavach-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/kavach-platform:v3.2.0'
      - '--region'
      - 'asia-south1' # Mumbai, India
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--cpu'
      - '2'
      - '--memory'
      - '2Gi'
      - '--concurrency'
      - '80'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/kavach-platform:v3.2.0'
