apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kavach-ingress
  namespace: kavach-mesh
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - kavach.bmu.ac.in
      secretName: kavach-tls-secret
  rules:
    - host: kavach.bmu.ac.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kavach-service
                port:
                  number: 8000
          - path: /api/bank
            pathType: Prefix
            backend:
              service:
                name: banking-service
                port:
                  number: 8050
          - path: /results
            pathType: Prefix
            backend:
              service:
                name: results-service
                port:
                  number: 8090
