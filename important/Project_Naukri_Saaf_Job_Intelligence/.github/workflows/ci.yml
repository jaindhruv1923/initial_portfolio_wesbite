name: CI / Production Quality Gate

on:
  push:
    branches: [ main, upgrade ]
  pull_request:
    branches: [ main, upgrade ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov ruff httpx

    - name: Lint with Ruff
      run: |
        ruff check src/ tests/ --ignore E501,F401,F841 || true

    - name: Run Pytest Quality Gates
      run: |
        pytest -v tests/ --cov=src --cov-report=term-missing
