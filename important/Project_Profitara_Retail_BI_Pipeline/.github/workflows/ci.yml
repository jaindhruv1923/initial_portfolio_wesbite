name: Profitara CI Pipeline

on:
  push:
    branches: [ main, upgrade ]
  pull_request:
    branches: [ main, upgrade ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Real Retail Dataset
        run: |
          python scripts/download_real_data.py

      - name: Run Analytical Pipeline
        run: |
          python ml_pipeline/clv_engine.py
          python ml_pipeline/churn_decision_engine.py
          python ml_pipeline/segmentation_basket.py
          python ml_pipeline/forecasting_engine.py
          python sql/init_duckdb.py
          python scripts/generate_qa_pairs.py

      - name: Run Test Suite
        run: |
          pytest tests/ -v
