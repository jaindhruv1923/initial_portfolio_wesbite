<svg width="900" height="470" viewBox="0 0 900 470" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="termShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { animation: cursorBlink 1s infinite; fill: #F59E0B; }
    
    @keyframes lineFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .terminal-line { animation: lineFade 0.6s ease-out forwards; }
  </style>

  <!-- Container Box with Shadow & Glow Border -->
  <rect x="10" y="10" width="880" height="450" rx="12" fill="url(#termBg)" filter="url(#termShadow)"/>
  <rect x="10" y="10" width="880" height="450" rx="12" fill="none" stroke="url(#termBorder)" stroke-width="1.2"/>

  <!-- Terminal Top Header Bar -->
  <path d="M 10 22 C 10 15.37 15.37 10 22 10 L 878 10 C 884.63 10 890 15.37 890 22 L 890 48 L 10 48 Z" fill="#131B2B"/>
  <line x1="10" y1="48" x2="890" y2="48" stroke="#1E293B" stroke-width="1"/>

  <!-- Window Controls (Traffic Lights) -->
  <circle cx="34" cy="29" r="6" fill="#EF4444"/>
  <circle cx="54" cy="29" r="6" fill="#F59E0B"/>
  <circle cx="74" cy="29" r="6" fill="#10B981"/>

  <!-- Title Tab -->
  <g transform="translate(450, 30)">
    <text text-anchor="middle" class="mono" font-size="12" fill="#94A3B8" font-weight="600">
      dhruv@sol-terminal: ~/systems/audit_telemetry <tspan fill="#38BDF8">git:(main)</tspan> <tspan fill="#10B981">✔</tspan>
    </text>
  </g>

  <!-- Terminal Content Lines -->
  <g transform="translate(32, 82)" class="mono" font-size="12.5" line-height="24">
    <!-- Command Prompt -->
    <text y="0" fill="#38BDF8" font-weight="700">➜ <tspan fill="#F59E0B">portfolio</tspan> <tspan fill="#94A3B8">on</tspan> <tspan fill="#A855F7">main</tspan> <tspan fill="#E2E8F0">$ ./audit_engine.sh --verify-all --deep-check</tspan></text>

    <!-- Execution Output -->
    <g transform="translate(0, 28)">
      <text y="0" fill="#64748B">[00:00.012]</text>
      <text x="90" y="0" fill="#10B981" font-weight="700">✔ SYSTEM INITIALIZED</text>
      <text x="260" y="0" fill="#CBD5E1">Dhruv Jain · B.Tech CSE (AI &amp; Data Science) · 2023–2027</text>
    </g>

    <g transform="translate(0, 56)">
      <text y="0" fill="#64748B">[00:00.084]</text>
      <text x="90" y="0" fill="#38BDF8" font-weight="700">✔ DATA LAKE / SQL</text>
      <text x="260" y="0" fill="#CBD5E1">DuckDB OLAP + PostgreSQL · 42 Analytical Queries &amp; Window Functions</text>
    </g>

    <g transform="translate(0, 84)">
      <text y="0" fill="#64748B">[00:00.142]</text>
      <text x="90" y="0" fill="#F59E0B" font-weight="700">✔ BI &amp; DAX MODELING</text>
      <text x="260" y="0" fill="#CBD5E1">Profitara &amp; Naukri Saaf Star Schemas · 22 Custom DAX Measures</text>
    </g>

    <g transform="translate(0, 112)">
      <text y="0" fill="#64748B">[00:00.210]</text>
      <text x="90" y="0" fill="#10B981" font-weight="700">✔ PREDICTIVE ML</text>
      <text x="260" y="0" fill="#CBD5E1">Random Forest CLV (R²=0.930) · LightGBM Churn (AUC=0.91) · TreeSHAP</text>
    </g>

    <g transform="translate(0, 140)">
      <text y="0" fill="#64748B">[00:00.320]</text>
      <text x="90" y="0" fill="#A855F7" font-weight="700">✔ AGENTIC SECURITY</text>
      <text x="260" y="0" fill="#CBD5E1">KAVACH Sentinel: 164/164 Pytest suites passed · AST blast radius active</text>
    </g>

    <g transform="translate(0, 168)">
      <text y="0" fill="#64748B">[00:00.415]</text>
      <text x="90" y="0" fill="#38BDF8" font-weight="700">✔ HYBRID RAG IDE</text>
      <text x="260" y="0" fill="#CBD5E1">Archon Copilot: BM25 + BGE Dense + Cross-Encoder · 78 Eval Pairs</text>
    </g>

    <g transform="translate(0, 196)">
      <text y="0" fill="#64748B">[00:00.490]</text>
      <text x="90" y="0" fill="#EC4899" font-weight="700">✔ FULL-STACK APIS</text>
      <text x="260" y="0" fill="#CBD5E1">Node.js · Express · MongoDB Atlas (Windows SRV Patched) · Next.js 14</text>
    </g>

    <g transform="translate(0, 230)">
      <rect x="0" y="-14" width="836" height="34" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="14" y="8" fill="#F59E0B" font-weight="700">💡 CORE CREED:</text>
      <text x="145" y="8" fill="#F1F5F9" font-style="italic">"If a number appears in my portfolio, I can show you the cell or query that computed it."</text>
    </g>

    <!-- Next Interactive Prompt with Animated Cursor -->
    <g transform="translate(0, 290)">
      <text y="0" fill="#38BDF8" font-weight="700">➜ <tspan fill="#F59E0B">portfolio</tspan> <tspan fill="#94A3B8">on</tspan> <tspan fill="#A855F7">main</tspan> <tspan fill="#E2E8F0">$ open --role data-analyst-or-ai-engineer</tspan></text>
      <text y="24" fill="#10B981" font-weight="600">✔ Ready to ship business impact. Ready for technical interviews.</text>
      <text y="48" fill="#64748B">dhruv.jain@status: <tspan fill="#F59E0B">awaiting your call</tspan></text>
      <rect x="310" y="37" width="8" height="14" class="cursor"/>
    </g>
  </g>
</svg>
