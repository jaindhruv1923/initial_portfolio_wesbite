<svg width="1200" height="130" viewBox="0 0 1200 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
    </linearGradient>

    <pattern id="footGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes sweepGlow {
      0% { stop-color: #F59E0B; }
      50% { stop-color: #38BDF8; }
      100% { stop-color: #F59E0B; }
    }
  </style>

  <rect width="1200" height="130" rx="12" fill="url(#footerBg)" stroke="#1E293B" stroke-width="1"/>
  <rect width="1200" height="130" rx="12" fill="url(#footGrid)"/>
  
  <!-- Glowing top line -->
  <line x1="20" y1="2" x2="1180" y2="2" stroke="url(#footerBorder)" stroke-width="2"/>

  <!-- Footer Content -->
  <g transform="translate(600, 48)">
    <text text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#F8FAFC" letter-spacing="2">
      "TRACEABILITY FIRST, IMPRESSIVE-SOUNDING SECOND."
    </text>
  </g>

  <g transform="translate(600, 78)">
    <text text-anchor="middle" class="mono" font-size="11.5" fill="#94A3B8" letter-spacing="1">
      Architected &amp; Shipped by <tspan fill="#F59E0B" font-weight="700">Dhruv Jain</tspan> · Delhi NCR, India · B.Tech CSE (AI &amp; Data Science)
    </text>
  </g>

  <g transform="translate(600, 102)">
    <circle cx="-130" cy="-3" r="3.5" fill="#10B981"/>
    <text text-anchor="middle" class="mono" font-size="10" fill="#64748B">
      All telemetry verified against raw notebooks, test suites &amp; DuckDB OLAP queries
    </text>
  </g>
</svg>
