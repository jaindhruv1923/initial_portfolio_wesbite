<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0E17"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAB308"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      50% { opacity: 0.5; }
      100% { transform: translateY(350px); opacity: 0; }
    }
    @keyframes radarBlink {
      0%, 100% { opacity: 1; r: 5; }
      50% { opacity: 0.3; r: 7; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    
    .pulse-dot { animation: radarBlink 2s infinite ease-in-out; }
    .scan-beam { animation: scanline 8s infinite linear; }
    .animated-border { stroke-dasharray: 20 10; animation: dashMove 30s infinite linear; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Outer Frame with Glowing Border -->
  <rect x="2" y="2" width="1196" height="336" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" class="animated-border"/>

  <!-- Radial Glow Orbs -->
  <circle cx="200" cy="80" r="140" fill="#F59E0B" fill-opacity="0.07" filter="url(#glowGold)"/>
  <circle cx="1000" cy="220" r="160" fill="#38BDF8" fill-opacity="0.06" filter="url(#glowCyan)"/>

  <!-- Geometric Corner Accents -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#F59E0B" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 1180 40 L 1180 20 L 1160 20" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 20 300 L 20 320 L 40 320" stroke="#38BDF8" stroke-width="2.5" fill="none" opacity="0.8"/>
  <path d="M 1180 300 L 1180 320 L 1160 320" stroke="#F59E0B" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- Top Status Radar Pill -->
  <g transform="translate(600, 48)">
    <rect x="-240" y="-16" width="480" height="32" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="-212" cy="0" r="5" fill="#10B981" class="pulse-dot"/>
    <circle cx="-212" cy="0" r="9" fill="none" stroke="#10B981" stroke-width="1" opacity="0.5"/>
    <text x="-192" y="4.5" fill="#94A3B8" class="mono" font-size="11" font-weight="600" letter-spacing="1.2">
      STATUS: OPEN TO ROLES · DATA ANALYTICS &amp; AI SYSTEMS
    </text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(600, 132)">
    <!-- Backdrop Shadow Blur -->
    <text x="0" y="0" text-anchor="middle" class="sans" font-size="54" font-weight="900" fill="#000000" opacity="0.5" letter-spacing="4">
      DHRUV JAIN
    </text>
    <!-- Foreground Glowing Text -->
    <text x="0" y="-2" text-anchor="middle" class="sans" font-size="54" font-weight="900" fill="#F8FAFC" letter-spacing="4">
      DHRUV JAIN
    </text>
    <path d="M -180 18 L 180 18" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Subtitle / Positioning Statement -->
  <g transform="translate(600, 185)">
    <text x="0" y="0" text-anchor="middle" class="sans" font-size="18" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">
      Data Analytics Engineer <tspan fill="#F59E0B">|</tspan> Agentic AI Systems Architect <tspan fill="#38BDF8">|</tspan> Full-Stack Builder
    </text>
    <text x="0" y="24" text-anchor="middle" class="mono" font-size="12" fill="#94A3B8" letter-spacing="1">
      B.Tech CSE (AI &amp; Data Science) · BML Munjal University · Class of 2027 · Delhi NCR, India
    </text>
  </g>

  <!-- 4 Interactive-Style Metric Telemetry Badges -->
  <g transform="translate(600, 275)">
    <!-- Badge 1: Profitara -->
    <g transform="translate(-420, 0)">
      <rect x="0" y="-18" width="195" height="36" rx="8" fill="#131C2E" stroke="#1E293B" stroke-width="1"/>
      <path d="M 0 -10 L 0 10" stroke="#F59E0B" stroke-width="3"/>
      <text x="14" y="-2" fill="#F59E0B" class="mono" font-size="10" font-weight="700">PROFITARA BI</text>
      <text x="14" y="11" fill="#E2E8F0" class="mono" font-size="10.5">R²=0.930 · ₹66.95L</text>
    </g>

    <!-- Badge 2: KAVACH -->
    <g transform="translate(-205, 0)">
      <rect x="0" y="-18" width="195" height="36" rx="8" fill="#131C2E" stroke="#1E293B" stroke-width="1"/>
      <path d="M 0 -10 L 0 10" stroke="#10B981" stroke-width="3"/>
      <text x="14" y="-2" fill="#10B981" class="mono" font-size="10" font-weight="700">KAVACH SENTINEL</text>
      <text x="14" y="11" fill="#E2E8F0" class="mono" font-size="10.5">164/164 Pytest Pass</text>
    </g>

    <!-- Badge 3: Naukri Saaf -->
    <g transform="translate(10, 0)">
      <rect x="0" y="-18" width="195" height="36" rx="8" fill="#131C2E" stroke="#1E293B" stroke-width="1"/>
      <path d="M 0 -10 L 0 10" stroke="#38BDF8" stroke-width="3"/>
      <text x="14" y="-2" fill="#38BDF8" class="mono" font-size="10" font-weight="700">NAUKRI SAAF ML</text>
      <text x="14" y="11" fill="#E2E8F0" class="mono" font-size="10.5">2,851 Scrapes · SHAP</text>
    </g>

    <!-- Badge 4: Archon Copilot -->
    <g transform="translate(225, 0)">
      <rect x="0" y="-18" width="195" height="36" rx="8" fill="#131C2E" stroke="#1E293B" stroke-width="1"/>
      <path d="M 0 -10 L 0 10" stroke="#A855F7" stroke-width="3"/>
      <text x="14" y="-2" fill="#A855F7" class="mono" font-size="10" font-weight="700">ARCHON HYBRID RAG</text>
      <text x="14" y="11" fill="#E2E8F0" class="mono" font-size="10.5">78 Eval Pairs · CoT</text>
    </g>
  </g>
</svg>
