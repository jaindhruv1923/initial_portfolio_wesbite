<svg width="1140" height="280" viewBox="0 0 1140 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151E2E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="30%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes flowArrow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .flow-line {
      stroke-dasharray: 6 4;
      animation: flowArrow 2s linear infinite;
    }
  </style>

  <!-- Container -->
  <rect width="1140" height="280" rx="14" fill="url(#archBg)" stroke="#1E293B" stroke-width="1.2"/>
  <rect width="1140" height="280" rx="14" fill="url(#archGrid)"/>

  <!-- Top System Header -->
  <g transform="translate(40, 36)">
    <text class="sans" font-size="14" font-weight="800" fill="#F8FAFC" letter-spacing="1.5">
      END-TO-END DATA &amp; AI SYSTEMS ARCHITECTURE
    </text>
    <text x="440" y="0" class="mono" font-size="11" fill="#64748B">
      // 5-STAGE CLOSED LOOP: INGESTION ➔ SQL LAKEHOUSE ➔ PREDICTIVE ML ➔ AGENTIC GOVERNANCE ➔ PRODUCTION SURFACES
    </text>
  </g>

  <!-- Connecting Bus Lines -->
  <g transform="translate(0, 150)">
    <line x1="210" y1="0" x2="250" y2="0" stroke="url(#wireGrad)" stroke-width="2.5" class="flow-line"/>
    <polygon points="250,-4 258,0 250,4" fill="#F59E0B"/>

    <line x1="430" y1="0" x2="470" y2="0" stroke="url(#wireGrad)" stroke-width="2.5" class="flow-line"/>
    <polygon points="470,-4 478,0 470,4" fill="#10B981"/>

    <line x1="650" y1="0" x2="690" y2="0" stroke="url(#wireGrad)" stroke-width="2.5" class="flow-line"/>
    <polygon points="690,-4 698,0 690,4" fill="#38BDF8"/>

    <line x1="870" y1="0" x2="910" y2="0" stroke="url(#wireGrad)" stroke-width="2.5" class="flow-line"/>
    <polygon points="910,-4 918,0 910,4" fill="#A855F7"/>
  </g>

  <!-- 5 Architecture Pillars (Cards) -->
  
  <!-- Pillar 1: Ingestion & Scraping -->
  <g transform="translate(30, 68)">
    <rect width="180" height="175" rx="10" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="180" height="28" rx="10" fill="#F59E0B" fill-opacity="0.15"/>
    <text x="14" y="19" class="mono" font-size="10.5" font-weight="700" fill="#F59E0B">01 · INGESTION &amp; ETL</text>
    <text x="14" y="52" class="sans" font-size="12" font-weight="700" fill="#F1F5F9">Raw Web &amp; Data</text>
    <text x="14" y="74" class="sans" font-size="11" fill="#94A3B8">• 2,851 Portal Scrapes</text>
    <text x="14" y="94" class="sans" font-size="11" fill="#94A3B8">• Apify / Thunderbit</text>
    <text x="14" y="114" class="sans" font-size="11" fill="#94A3B8">• Weak Supervision</text>
    <text x="14" y="134" class="sans" font-size="11" fill="#94A3B8">• 10,000 Q-Comm Logs</text>
    <rect x="14" y="148" width="152" height="18" rx="4" fill="#0B0F19"/>
    <text x="22" y="161" class="mono" font-size="9" fill="#F59E0B">Snorkel κ = 0.589</text>
  </g>

  <!-- Pillar 2: Analytics & OLAP -->
  <g transform="translate(250, 68)">
    <rect width="180" height="175" rx="10" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="180" height="28" rx="10" fill="#10B981" fill-opacity="0.15"/>
    <text x="14" y="19" class="mono" font-size="10.5" font-weight="700" fill="#10B981">02 · ANALYTICS LAKE</text>
    <text x="14" y="52" class="sans" font-size="12" font-weight="700" fill="#F1F5F9">DuckDB &amp; SQL</text>
    <text x="14" y="74" class="sans" font-size="11" fill="#94A3B8">• 42 Analytical CTEs</text>
    <text x="14" y="94" class="sans" font-size="11" fill="#94A3B8">• Star Schema Modeling</text>
    <text x="14" y="114" class="sans" font-size="11" fill="#94A3B8">• 22 Custom DAX Rules</text>
    <text x="14" y="134" class="sans" font-size="11" fill="#94A3B8">• Window Analytics</text>
    <rect x="14" y="148" width="152" height="18" rx="4" fill="#0B0F19"/>
    <text x="22" y="161" class="mono" font-size="9" fill="#10B981">₹66.95L 100% Traceable</text>
  </g>

  <!-- Pillar 3: Predictive ML -->
  <g transform="translate(470, 68)">
    <rect width="180" height="175" rx="10" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="180" height="28" rx="10" fill="#38BDF8" fill-opacity="0.15"/>
    <text x="14" y="19" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8">03 · PREDICTIVE ML</text>
    <text x="14" y="52" class="sans" font-size="12" font-weight="700" fill="#F1F5F9">Models &amp; Explainability</text>
    <text x="14" y="74" class="sans" font-size="11" fill="#94A3B8">• RF CLV Regressor</text>
    <text x="14" y="94" class="sans" font-size="11" fill="#94A3B8">• GBDT / LightGBM</text>
    <text x="14" y="114" class="sans" font-size="11" fill="#94A3B8">• TreeSHAP Attribution</text>
    <text x="14" y="134" class="sans" font-size="11" fill="#94A3B8">• Holt-Winters Forecast</text>
    <rect x="14" y="148" width="152" height="18" rx="4" fill="#0B0F19"/>
    <text x="22" y="161" class="mono" font-size="9" fill="#38BDF8">R²=0.930 | AUC=0.91</text>
  </g>

  <!-- Pillar 4: Agentic AI & Safety -->
  <g transform="translate(690, 68)">
    <rect width="180" height="175" rx="10" fill="url(#cardGrad)" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="180" height="28" rx="10" fill="#A855F7" fill-opacity="0.15"/>
    <text x="14" y="19" class="mono" font-size="10.5" font-weight="700" fill="#A855F7">04 · AGENTIC AI &amp; RAG</text>
    <text x="14" y="52" class="sans" font-size="12" font-weight="700" fill="#F1F5F9">Security &amp; Copilots</text>
    <text x="14" y="74" class="sans" font-size="11" fill="#94A3B8">• KAVACH AST Sentinel</text>
    <text x="14" y="94" class="sans" font-size="11" fill="#94A3B8">• Qdrant Vector Engine</text>
    <text x="14" y="114" class="sans" font-size="11" fill="#94A3B8">• BM25 + BGE Rerank</text>
    <text x="14" y="134" class="sans" font-size="11" fill="#94A3B8">• LLM CoT Judge (78 pairs)</text>
    <rect x="14" y="148" width="152" height="18" rx="4" fill="#0B0F19"/>
    <text x="22" y="161" class="mono" font-size="9" fill="#A855F7">164/164 Pytest Passes</text>
  </g>

  <!-- Pillar 5: Production Surfaces -->
  <g transform="translate(910, 68)">
    <rect width="200" height="175" rx="10" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1.2" stroke-opacity="0.7"/>
    <rect x="0" y="0" width="200" height="28" rx="10" fill="#EC4899" fill-opacity="0.15"/>
    <text x="14" y="19" class="mono" font-size="10.5" font-weight="700" fill="#EC4899">05 · PRODUCTION SURFACES</text>
    <text x="14" y="52" class="sans" font-size="12" font-weight="700" fill="#F1F5F9">Client &amp; Stakeholder</text>
    <text x="14" y="74" class="sans" font-size="11" fill="#94A3B8">• Power BI Dashboards</text>
    <text x="14" y="94" class="sans" font-size="11" fill="#94A3B8">• 13-Page Streamlit</text>
    <text x="14" y="114" class="sans" font-size="11" fill="#94A3B8">• Chrome Extension MV3</text>
    <text x="14" y="134" class="sans" font-size="11" fill="#94A3B8">• Node / MongoDB Atlas</text>
    <rect x="14" y="148" width="172" height="18" rx="4" fill="#0B0F19"/>
    <text x="22" y="161" class="mono" font-size="9" fill="#EC4899">Deploys &amp; Real-time APIs</text>
  </g>
</svg>
